<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <!-- Google Sekme İkonu (Favicon) -->
    <link rel="icon" href="https://www.google.com/favicon.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Plus Jakarta Sans ve Kaushan Script) -->
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        script: ['Kaushan Script', 'cursive'],
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'float': 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%': { transform: 'scale(1)', filter: 'drop-shadow(0 0 15px rgba(255,255,255,0.4))' },
                            '100%': { transform: 'scale(1.05)', filter: 'drop-shadow(0 0 30px rgba(255,255,255,0.8))' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-10px) rotate(3deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .form-transition {
            transition: opacity 0.3s ease-in-out;
        }
        input[type=range] {
            accent-color: #4f46e5;
        }

        @keyframes fadeInSlide {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .delayed-entry {
            opacity: 0;
            pointer-events: none;
            transition: all 1s ease;
        }

        .delayed-entry.show {
            opacity: 1;
            pointer-events: auto;
            animation: fadeInSlide 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Kelime Efekti İçin Gizleme/Gösterme Animasyonları */
        .word-item {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            filter: blur(10px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .word-item.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        /* Modern Sakura Ağacı Arka Plan Işıltısı */
        .sakura-glow {
            background: radial-gradient(circle, rgba(244,114,182,0.15) 0%, rgba(0,0,0,0) 70%);
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center relative overflow-hidden text-slate-800">

    <!-- Arka Planda Çalacak Müzik -->
    <audio id="bg-music" loop>
        <source src="muzik.mp3" type="audio/mpeg">
    </audio>

    <!-- BAŞLANGIÇ EKRANI (Modern Sakura Ağaçları, Çerçeve Çizgileri ve Işıklar) -->
    <div id="welcome-overlay" onclick="startExperience()" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black cursor-pointer transition-opacity duration-1000 overflow-hidden">
        
        <!-- Üst ve Alt Kısım İçin Modern Beyaz Çizgiler (Çerçeve Efekti) -->
        <div class="absolute top-6 left-8 right-8 h-[1px] bg-white/30 shadow-[0_0_10px_rgba(255,255,255,0.5)] pointer-events-none"></div>
        <div class="absolute bottom-6 left-8 right-8 h-[1px] bg-white/30 shadow-[0_0_10px_rgba(255,255,255,0.5)] pointer-events-none"></div>

        <!-- Arkadan Sazan Yumuşak Pembe Parlamalar -->
        <div class="absolute -left-20 -top-20 w-96 h-96 sakura-glow rounded-full pointer-events-none"></div>
        <div class="absolute -right-20 -bottom-20 w-96 h-96 sakura-glow rounded-full pointer-events-none"></div>

        <!-- Sol Modern Sakura Ağacı Dalı (SVG) -->
        <div class="absolute left-0 top-0 w-72 md:w-96 h-full pointer-events-none opacity-50 transition-opacity duration-1000">
            <svg viewBox="0 0 400 800" class="w-full h-full text-pink-400" fill="none">
                <path d="M-20,-20 Q80,150 120,350 T60,700" stroke="currentColor" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
                <path d="M60,180 Q140,220 220,180" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
                <path d="M40,300 Q110,340 180,290" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <path d="M80,500 Q150,520 210,460" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <!-- Pembe Çiçek Küme Parçacıkları -->
                <circle cx="120" cy="350" r="22" fill="#f472b6" opacity="0.4" filter="blur(6px)"/>
                <circle cx="220" cy="180" r="16" fill="#f472b6" opacity="0.5" filter="blur(5px)"/>
                <circle cx="180" cy="290" r="18" fill="#f472b6" opacity="0.5" filter="blur(5px)"/>
                <circle cx="210" cy="460" r="20" fill="#f472b6" opacity="0.4" filter="blur(6px)"/>
                <circle cx="90" cy="120" r="14" fill="#fb7185" opacity="0.4" filter="blur(4px)"/>
            </svg>
        </div>

        <!-- Sağ Modern Sakura Ağacı Dalı (SVG) -->
        <div class="absolute right-0 bottom-0 w-72 md:w-96 h-full pointer-events-none opacity-50 transition-opacity duration-1000 transform scale-x-[-1]">
            <svg viewBox="0 0 400 800" class="w-full h-full text-pink-400" fill="none">
                <path d="M-20,-20 Q80,150 120,350 T60,700" stroke="currentColor" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
                <path d="M60,180 Q140,220 220,180" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
                <path d="M40,300 Q110,340 180,290" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <path d="M80,500 Q150,520 210,460" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
                <!-- Pembe Çiçek Küme Parçacıkları -->
                <circle cx="120" cy="350" r="22" fill="#f472b6" opacity="0.4" filter="blur(6px)"/>
                <circle cx="220" cy="180" r="16" fill="#f472b6" opacity="0.5" filter="blur(5px)"/>
                <circle cx="180" cy="290" r="18" fill="#f472b6" opacity="0.5" filter="blur(5px)"/>
                <circle cx="210" cy="460" r="20" fill="#f472b6" opacity="0.4" filter="blur(6px)"/>
                <circle cx="90" cy="120" r="14" fill="#fb7185" opacity="0.4" filter="blur(4px)"/>
            </svg>
        </div>

        <!-- İlk Adım: Logo ve Tıklama Yazısı -->
        <div id="welcome-content" class="relative z-10 flex flex-col items-center group animate-float">
            <img src="logo.png" alt="Özel Logo" class="w-24 h-24 md:w-32 md:h-32 object-contain animate-glow transition-transform duration-300 group-hover:scale-110 mb-6 rounded-2xl">
            <div class="w-24 h-1 bg-gradient-to-r from-transparent via-pink-400 to-transparent rounded-full blur-[1px] shadow-[0_0_15px_rgba(244,114,182,0.8)]"></div>
            <p class="text-slate-400 text-xs mt-8 tracking-widest uppercase font-medium animate-pulse">Devam etmek için tıklayın</p>
        </div>

        <!-- İkinci Adım: Kaushan Script Fontuyla Tam Ortada Tek Tek Belirecek Yazı -->
        <div id="made-by-container" class="absolute inset-0 z-10 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
            <h1 class="text-4xl md:text-6xl font-script tracking-wider text-white flex gap-4 drop-shadow-[0_0_25px_rgba(244,114,182,0.7)]">
                <span id="word-1" class="word-item">Made</span>
                <span id="word-2" class="word-item">by</span>
                <span id="word-3" class="word-item text-pink-400">Enes</span>
            </h1>
        </div>

    </div>

    <!-- Sağ Üst Gelişmiş Müzik Çalar Widget'ı -->
    <div class="absolute top-6 right-6 z-20 flex items-center gap-3 bg-white/90 backdrop-blur-md border border-slate-200/80 px-4 py-3 rounded-2xl shadow-lg shadow-slate-200/50">
        <div class="flex items-center gap-3 pr-2 border-r border-slate-200">
            <div class="w-9 h-9 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 shadow-sm">
                <i id="music-disc-icon" class="fa-solid fa-music"></i>
            </div>
            <div class="flex flex-col">
                <span class="text-xs font-bold text-slate-800 tracking-wide">iphone kupi (bare minimum)</span>
                <span class="text-[10px] text-slate-400 font-medium">Alixiane</span>
            </div>
        </div>

        <button onclick="toggleMusic()" id="play-pause-btn" class="w-9 h-9 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-md shadow-indigo-600/30 transition-all transform hover:scale-105 active:scale-95">
            <i id="play-pause-icon" class="fa-solid fa-play text-xs ml-0.5"></i>
        </button>

        <div class="flex items-center gap-2 pl-1">
            <i class="fa-solid fa-volume-low text-slate-400 text-xs"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.2" oninput="changeVolume(this.value)" class="w-16 h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer">
            <i class="fa-solid fa-volume-high text-slate-400 text-xs"></i>
        </div>
    </div>

    <!-- Kenar Fotoğrafları Konteyneri -->
    <div class="absolute inset-0 flex justify-between items-center pointer-events-none z-0 overflow-hidden">
        <div class="h-full w-[45%] md:w-[40%] bg-no-repeat bg-[center_left_10%] bg-cover opacity-90" style="background-image: url('enes.jpg'); -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to right, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);"></div>
        <div class="h-full w-[45%] md:w-[40%] bg-no-repeat bg-[center_right_10%] bg-cover opacity-90" style="background-image: url('enescana.jpg'); -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to left, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);"></div>
    </div>

    <div class="absolute inset-0 bg-white/40 z-0 pointer-events-none"></div>

    <!-- Ana Konteyner (Giriş Kartı) -->
    <div id="login-container" class="relative z-10 w-full max-w-md p-6 delayed-entry">
        <div class="glass-card rounded-3xl p-8 shadow-2xl shadow-slate-300/60 relative">
            
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-fuchsia-600 text-white text-xl shadow-lg shadow-indigo-500/25 mb-3 transform hover:scale-105 transition-transform duration-300">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <h1 id="main-title" class="text-2xl font-bold tracking-tight text-slate-900">Hoş Geldiniz</h1>
                <p id="main-subtitle" class="text-sm text-slate-500 mt-1">Devam etmek için lütfen hesabınıza giriş yapın</p>
            </div>

            <div class="flex rounded-xl bg-slate-200/80 p-1 mb-6 border border-slate-300/60 relative">
                <div id="tab-indicator" class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-white rounded-lg shadow-md transition-all duration-300 ease-out left-1"></div>
                <button onclick="switchTab('login')" id="btn-login" class="flex-1 relative z-10 py-2.5 text-sm font-semibold text-slate-900 transition-colors duration-200">Giriş Yap</button>
                <button onclick="switchTab('register')" id="btn-register" class="flex-1 relative z-10 py-2.5 text-sm font-semibold text-slate-500 transition-colors duration-200">Kayıt Ol</button>
            </div>

            <div class="relative min-h-[270px]">
                <form id="login-form" class="form-transition space-y-4 absolute inset-0 opacity-100">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">E-posta veya Kullanıcı Adı</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="text" required placeholder="ornek@mail.com" class="w-full bg-white/80 border border-slate-200 rounded-xl px-4 py-3 pl-11 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all shadow-sm">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Şifre</label>
                            <a href="#" class="text-xs text-indigo-600 hover:text-indigo-500 transition-colors font-medium">Şifremi Unuttum?</a>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" required placeholder="••••••••" class="w-full bg-white/80 border border-slate-200 rounded-xl px-4 py-3 pl-11 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all shadow-sm">
                        </div>
                    </div>

                    <div class="flex items-center pt-1">
                        <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-white border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <label for="remember" class="ml-2 text-sm text-slate-600">Beni hatırla</label>
                    </div>

                    <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-fuchsia-600 hover:from-indigo-500 hover:to-fuchsia-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/25 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">
                        Giriş Yap
                    </button>
                </form>

                <form id="register-form" class="form-transition space-y-4 absolute inset-0 opacity-0 pointer-events-none hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Kullanıcı Adı</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                <i class="fa-regular fa-user"></i>
                            </span>
                            <input type="text" required placeholder="kullaniciadi" class="w-full bg-white/80 border border-slate-200 rounded-xl px-4 py-3 pl-11 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all shadow-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">E-posta Adresi</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" required placeholder="ornek@mail.com" class="w-full bg-white/80 border border-slate-200 rounded-xl px-4 py-3 pl-11 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all shadow-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Şifre</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" required placeholder="••••••••" class="w-full bg-white/80 border border-slate-200 rounded-xl px-4 py-3 pl-11 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all shadow-sm">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-fuchsia-600 to-indigo-600 hover:from-fuchsia-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-fuchsia-600/25 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">
                        Hesap Oluştur
                    </button>
                </form>
            </div>

            <div class="mt-28 pt-6 border-t border-slate-200 text-center">
                <p class="text-xs text-slate-400 mb-3">veya şununla devam et</p>
                <div class="flex gap-3">
                    <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 transition-colors shadow-sm">
                        <i class="fa-brands fa-google text-red-500"></i> Google
                    </button>
                    <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 transition-colors shadow-sm">
                        <i class="fa-brands fa-github text-slate-900"></i> Github
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const music = document.getElementById('bg-music');
        music.volume = 0.2; // Ses seviyesi %20 (kısık)

        let hasStarted = false;

        // Tıklandığında tetiklenen akış
        function startExperience() {
            if (hasStarted) return;
            hasStarted = true;

            // Müziği başlat
            music.play();
            document.getElementById('play-pause-icon').className = "fa-solid fa-pause text-xs";
            document.getElementById('music-disc-icon').className = "fa-solid fa-music animate-spin";

            // İlk tıklama ekranını gizle
            const welcomeContent = document.getElementById('welcome-content');
            welcomeContent.style.opacity = '0';
            welcomeContent.style.transition = 'opacity 0.5s ease';

            setTimeout(() => {
                welcomeContent.style.display = 'none';
                
                // Yazı alanını görünür yap
                const madeByContainer = document.getElementById('made-by-container');
                madeByContainer.style.opacity = '1';

                // 7 saniyeye yayılacak şekilde kelimeleri efektli ve sırayla getir
                setTimeout(() => { document.getElementById('word-1').classList.add('active'); }, 500);   // "Made"
                setTimeout(() => { document.getElementById('word-2').classList.add('active'); }, 2200);  // "by"
                setTimeout(() => { document.getElementById('word-3').classList.add('active'); }, 3800);  // "Enes"

            }, 500);

            // Tam 7 saniye sonra siyah perdeyi kaldır ve giriş ekranını göster
            setTimeout(() => {
                const overlay = document.getElementById('welcome-overlay');
                overlay.style.opacity = '0';
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 800);

                const loginContainer = document.getElementById('login-container');
                loginContainer.classList.add('show');
            }, 7000);
        }

        // Müzik Oynat / Durdur Butonu
        function toggleMusic() {
            const playPauseIcon = document.getElementById('play-pause-icon');
            const musicDiscIcon = document.getElementById('music-disc-icon');

            if (music.paused) {
                music.play();
                playPauseIcon.className = "fa-solid fa-pause text-xs";
                musicDiscIcon.className = "fa-solid fa-music animate-spin";
            } else {
                music.pause();
                playPauseIcon.className = "fa-solid fa-play text-xs ml-0.5";
                musicDiscIcon.className = "fa-solid fa-music";
            }
        }

        // Ses Seviyesi Ayarlama
        function changeVolume(val) {
            music.volume = val;
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const btnLogin = document.getElementById('btn-login');
            const btnRegister = document.getElementById('btn-register');
            const tabIndicator = document.getElementById('tab-indicator');
            const mainTitle = document.getElementById('main-title');
            const mainSubtitle = document.getElementById('main-subtitle');

            if (tab === 'login') {
                tabIndicator.style.left = '4px';
                btnLogin.classList.remove('text-slate-500');
                btnLogin.classList.add('text-slate-900');
                btnRegister.classList.remove('text-slate-900');
                btnRegister.classList.add('text-slate-500');

                mainTitle.innerText = "Hoş Geldiniz";
                mainSubtitle.innerText = "Devam etmek için lütfen hesabınıza giriş yapın";

                registerForm.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    registerForm.classList.add('hidden');
                    loginForm.classList.remove('hidden');
                    setTimeout(() => {
                        loginForm.classList.remove('opacity-0', 'pointer-events-none');
                    }, 20);
                }, 150);
            } else {
                tabIndicator.style.left = 'calc(50% + 0px)';
                btnRegister.classList.remove('text-slate-500');
                btnRegister.classList.add('text-slate-900');
                btnLogin.classList.remove('text-slate-900');
                btnLogin.classList.add('text-slate-500');

                mainTitle.innerText = "Aramıza Katılın";
                mainSubtitle.innerText = "Hızlıca yeni bir hesap oluşturun";

                loginForm.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    loginForm.classList.add('hidden');
                    registerForm.classList.remove('hidden');
                    setTimeout(() => {
                        registerForm.classList.remove('opacity-0', 'pointer-events-none');
                    }, 20);
                }, 150);
            }
        }
    </script>
</body>
</html>
