<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enes | Kişisel Vitrin</title>
    <!-- Google Sekme İkonu (Favicon) -->
    <link rel="icon" href="https://www.google.com/favicon.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        script: ['Kaushan Script', 'cursive'],
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'float': 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%': { transform: 'scale(1)', filter: 'drop-shadow(0 0 15px rgba(255,255,255,0.4))' },
                            '100%': { transform: 'scale(1.05)', filter: 'drop-shadow(0 0 30px rgba(255,255,255,0.8))' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-10px) rotate(3deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        input[type=range] {
            accent-color: #4f46e5;
        }

        @keyframes fadeInSlide {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .delayed-entry {
            opacity: 0;
            pointer-events: none;
            transition: all 1s ease;
        }

        .delayed-entry.show {
            opacity: 1;
            pointer-events: auto;
            animation: fadeInSlide 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .word-item {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            filter: blur(10px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .word-item.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        .sakura-glow {
            background: radial-gradient(circle, rgba(244,114,182,0.15) 0%, rgba(0,0,0,0) 70%);
        }

        /* Kar Yağışı Animasyonu */
        @keyframes snowfall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
            20% { opacity: 0.7; }
            100% { transform: translateY(105vh) translateX(15px); opacity: 0.1; }
        }
        .snowflake {
            position: absolute;
            top: -10vh;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: snowfall linear infinite;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center relative overflow-hidden text-slate-800">

    <!-- Arka Planda Çalacak Müzik -->
    <audio id="bg-music" loop>
        <source src="muzik.mp3" type="audio/mpeg">
    </audio>

    <!-- Kar Taneleri Konteyneri -->
    <div id="snow-container" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>

    <!-- Üst ve Alt Siyah Şeritler & Beyaz İnce Çizgiler -->
    <div class="absolute top-0 left-0 right-0 h-6 bg-black z-40 pointer-events-none"></div>
    <div class="absolute top-6 left-8 right-8 h-[1px] bg-white/30 shadow-[0_0_10px_rgba(255,255,255,0.5)] z-40 pointer-events-none"></div>

    <div class="absolute bottom-0 left-0 right-0 h-6 bg-black z-40 pointer-events-none"></div>
    <div class="absolute bottom-6 left-8 right-8 h-[1px] bg-white/30 shadow-[0_0_10px_rgba(255,255,255,0.5)] z-40 pointer-events-none"></div>

    <!-- BAŞLANGIÇ EKRANI (Sakura Ağaçları ile) -->
    <div id="welcome-overlay" onclick="startExperience()" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black cursor-pointer transition-opacity duration-1000 overflow-hidden">
        
        <div class="absolute -left-20 -top-20 w-96 h-96 sakura-glow rounded-full pointer-events-none"></div>
        <div class="absolute -right-20 -bottom-20 w-96 h-96 sakura-glow rounded-full pointer-events-none"></div>

        <!-- Sol Sakura Ağacı Dalı -->
        <div class="absolute left-0 top-0 w-72 md:w-96 h-full pointer-events-none opacity-50">
            <svg viewBox="0 0 400 800" class="w-full h-full text-pink-400" fill="none">
                <path d="M-20,-20 Q80,150 120,350 T60,700" stroke="currentColor" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
                <circle cx="120" cy="350" r="22" fill="#f472b6" opacity="0.4" filter="blur(6px)"/>
                <circle cx="220" cy="180" r="16" fill="#f472b6" opacity="0.5" filter="blur(5px)"/>
            </svg>
        </div>

        <!-- Sağ Sakura Ağacı Dalı -->
        <div class="absolute right-0 bottom-0 w-72 md:w-96 h-full pointer-events-none opacity-50 transform scale-x-[-1]">
            <svg viewBox="0 0 400 800" class="w-full h-full text-pink-400" fill="none">
                <path d="M-20,-20 Q80,150 120,350 T60,700" stroke="currentColor" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
                <circle cx="120" cy="350" r="22" fill="#f472b6" opacity="0.4" filter="blur(6px)"/>
                <circle cx="220" cy="180" r="16" fill="#f472b6" opacity="0.5" filter="blur(5px)"/>
            </svg>
        </div>

        <div id="welcome-content" class="relative z-10 flex flex-col items-center group animate-float">
            <img src="logo.png" alt="Özel Logo" class="w-24 h-24 md:w-32 md:h-32 object-contain animate-glow transition-transform duration-300 group-hover:scale-110 mb-6 rounded-2xl">
            <div class="w-24 h-1 bg-gradient-to-r from-transparent via-pink-400 to-transparent rounded-full blur-[1px] shadow-[0_0_15px_rgba(244,114,182,0.8)]"></div>
            <p class="text-slate-400 text-xs mt-8 tracking-widest uppercase font-medium animate-pulse">Devam etmek için tıklayın</p>
        </div>

        <div id="made-by-container" class="absolute inset-0 z-10 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
            <h1 class="text-4xl md:text-6xl font-script tracking-wider text-white flex gap-4 drop-shadow-[0_0_25px_rgba(244,114,182,0.7)]">
                <span id="word-1" class="word-item">Made</span>
                <span id="word-2" class="word-item">by</span>
                <span id="word-3" class="word-item text-pink-400">Enes</span>
            </h1>
        </div>
    </div>

    <!-- Sağ Üst Müzik Çalar -->
    <div class="absolute top-8 right-6 z-20 flex items-center gap-3 bg-white/90 backdrop-blur-md border border-slate-200/80 px-4 py-3 rounded-2xl shadow-lg shadow-slate-200/50">
        <div class="flex items-center gap-3 pr-2 border-r border-slate-200">
            <div class="w-9 h-9 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 shadow-sm">
                <i id="music-disc-icon" class="fa-solid fa-music"></i>
            </div>
            <div class="flex flex-col">
                <span class="text-xs font-bold text-slate-800 tracking-wide">iphone kupi (bare minimum)</span>
                <span class="text-[10px] text-slate-400 font-medium">Alixiane</span>
            </div>
        </div>

        <button onclick="toggleMusic()" id="play-pause-btn" class="w-9 h-9 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-md shadow-indigo-600/30 transition-all transform hover:scale-105 active:scale-95">
            <i id="play-pause-icon" class="fa-solid fa-play text-xs ml-0.5"></i>
        </button>

        <div class="flex items-center gap-2 pl-1">
            <i class="fa-solid fa-volume-low text-slate-400 text-xs"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.2" oninput="changeVolume(this.value)" class="w-16 h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer">
            <i class="fa-solid fa-volume-high text-slate-400 text-xs"></i>
        </div>
    </div>

    <!-- Kenar Fotoğrafları -->
    <div class="absolute inset-0 flex justify-between items-center pointer-events-none z-0 overflow-hidden">
        <div class="h-full w-[45%] md:w-[40%] bg-no-repeat bg-[center_left_10%] bg-cover opacity-90" style="background-image: url('enes.jpg'); -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to right, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);"></div>
        <div class="h-full w-[45%] md:w-[40%] bg-no-repeat bg-[center_right_10%] bg-cover opacity-90" style="background-image: url('enescana.jpg'); -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to left, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);"></div>
    </div>

    <div class="absolute inset-0 bg-white/40 z-0 pointer-events-none"></div>

    <!-- ANA KİŞİSEL VİTRİN KARTI (Sağdaki Fotoğrafınla) -->
    <div id="login-container" class="relative z-20 w-full max-w-md p-6 delayed-entry">
        <div class="glass-card rounded-3xl p-8 relative text-center">
            
            <!-- Profil Fotoğrafı (enescana.jpg) -->
            <div class="relative mx-auto w-20 h-20 mb-4 group">
                <div class="absolute inset-0 rounded-3xl bg-gradient-to-tr from-indigo-600 to-fuchsia-600 blur-md opacity-70 group-hover:opacity-100 transition-opacity"></div>
                <img src="enescana.jpg" alt="Enes" class="relative w-20 h-20 rounded-3xl object-cover border-2 border-white shadow-lg transform hover:scale-105 transition-transform duration-300">
            </div>

            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Enes</h1>
            <p class="text-sm text-slate-500 mt-1 mb-6">Sosyal medya hesaplarım ve bağlantılarım</p>

            <!-- Sosyal Medya Link Butonları -->
            <div class="space-y-3.5">
                <!-- Discord -->
                <a href="https://discord.com/channels/@me/267957657393037323" target="_blank" class="flex items-center justify-between p-3.5 bg-white/90 hover:bg-indigo-50 border border-slate-200/80 rounded-2xl text-slate-700 hover:text-indigo-600 transition-all shadow-sm group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-100 flex items-center justify-center text-indigo-600 group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-discord text-lg"></i>
                        </div>
                        <span class="font-semibold text-sm">Discord</span>
                    </div>
                    <i class="fa-solid fa-arrow-right text-xs text-slate-400 group-hover:translate-x-1 transition-transform"></i>
                </a>

                <!-- Pinterest -->
                <a href="https://tr.pinterest.com/Enesssssssssssssssss/_profile/" target="_blank" class="flex items-center justify-between p-3.5 bg-white/90 hover:bg-pink-50 border border-slate-200/80 rounded-2xl text-slate-700 hover:text-pink-600 transition-all shadow-sm group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-pink-100 flex items-center justify-center text-pink-600 group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-pinterest text-lg"></i>
                        </div>
                        <span class="font-semibold text-sm">Pinterest</span>
                    </div>
                    <i class="fa-solid fa-arrow-right text-xs text-slate-400 group-hover:translate-x-1 transition-transform"></i>
                </a>

                <!-- Spotify -->
                <a href="https://open.spotify.com/user/6ojmvvdquxxb2zvvev5e7cmpl?si=5c3cfead902b481d" target="_blank" class="flex items-center justify-between p-3.5 bg-white/90 hover:bg-emerald-50 border border-slate-200/80 rounded-2xl text-slate-700 hover:text-emerald-600 transition-all shadow-sm group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-600 group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-spotify text-lg"></i>
                        </div>
                        <span class="font-semibold text-sm">Spotify</span>
                    </div>
                    <i class="fa-solid fa-arrow-right text-xs text-slate-400 group-hover:translate-x-1 transition-transform"></i>
                </a>

                <!-- GitHub -->
                <a href="https://github.com/Enessss2" target="_blank" class="flex items-center justify-between p-3.5 bg-white/90 hover:bg-slate-100 border border-slate-200/80 rounded-2xl text-slate-700 hover:text-slate-900 transition-all shadow-sm group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-slate-200 flex items-center justify-center text-slate-800 group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-github text-lg"></i>
                        </div>
                        <span class="font-semibold text-sm">GitHub</span>
                    </div>
                    <i class="fa-solid fa-arrow-right text-xs text-slate-400 group-hover:translate-x-1 transition-transform"></i>
                </a>
            </div>

            <!-- Alt Kısım -->
            <div class="mt-8 pt-4 border-t border-slate-200 text-center">
                <p class="text-xs text-slate-400 font-script text-base">Made by Enes</p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Kar Yağışı Efekti
        function createSnow() {
            const snowContainer = document.getElementById('snow-container');
            const particleCount = 30; // Göz yormayacak hafif miktar

            for (let i = 0; i < particleCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                
                const size = Math.random() * 4 + 2 + 'px';
                snowflake.style.width = size;
                snowflake.style.height = size;
                snowflake.style.left = Math.random() * 100 + 'vw';
                
                const duration = Math.random() * 8 + 6 + 's';
                snowflake.style.animationDuration = duration;
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                
                snowContainer.appendChild(snowflake);
            }
        }
        createSnow();

        const music = document.getElementById('bg-music');
        music.volume = 0.2;

        let hasStarted = false;

        function startExperience() {
            if (hasStarted) return;
            hasStarted = true;

            music.play();
            document.getElementById('play-pause-icon').className = "fa-solid fa-pause text-xs";
            document.getElementById('music-disc-icon').className = "fa-solid fa-music animate-spin";

            const welcomeContent = document.getElementById('welcome-content');
            welcomeContent.style.opacity = '0';
            welcomeContent.style.transition = 'opacity 0.5s ease';

            setTimeout(() => {
                welcomeContent.style.display = 'none';
                
                const madeByContainer = document.getElementById('made-by-container');
                madeByContainer.style.opacity = '1';

                setTimeout(() => { document.getElementById('word-1').classList.add('active'); }, 500);
                setTimeout(() => { document.getElementById('word-2').classList.add('active'); }, 2200);
                setTimeout(() => { document.getElementById('word-3').classList.add('active'); }, 3800);

            }, 500);

            setTimeout(() => {
                const overlay = document.getElementById('welcome-overlay');
                overlay.style.opacity = '0';
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 800);

                const loginContainer = document.getElementById('login-container');
                loginContainer.classList.add('show');
            }, 7000);
        }

        function toggleMusic() {
            const playPauseIcon = document.getElementById('play-pause-icon');
            const musicDiscIcon = document.getElementById('music-disc-icon');

            if (music.paused) {
                music.play();
                playPauseIcon.className = "fa-solid fa-pause text-xs";
                musicDiscIcon.className = "fa-solid fa-music animate-spin";
            } else {
                music.pause();
                playPauseIcon.className = "fa-solid fa-play text-xs ml-0.5";
                musicDiscIcon.className = "fa-solid fa-music";
            }
        }

        function changeVolume(val) {
            music.volume = val;
        }
    </script>
</body>
</html>
